<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leafer Feather Logo Concepts</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #eef1f4; color: #17212b; font-family: Inter, Arial, sans-serif; }
      header { padding: 38px 52px 26px; border-bottom: 1px solid #d6dce2; background: #fff; }
      h1 { margin: 0; font-size: 30px; letter-spacing: 0; }
      p { margin: 9px 0 0; color: #66717e; font-size: 15px; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #d6dce2; }
      section { min-width: 0; background: #fff; padding: 28px 34px 34px; }
      h2 { margin: 0 0 12px; color: #66717e; font-size: 14px; font-weight: 650; letter-spacing: 0; }
      img { display: block; width: 100%; height: auto; background: #fff; }
      @media (max-width: 900px) { main { grid-template-columns: 1fr; } header { padding: 26px; } }
    </style>
  </head>
  <body>
    <header>
      <h1>Leafer Feather</h1>
      <p>Logo concepts · LeaferJS identity + plugin signal + feathered contour</p>
    </header>
    <main>
      <section><h2>01 · 柔边叶片</h2><img src="logo-01-soft-leaf.svg" alt="柔边叶片方案"></section>
      <section><h2>02 · 插件端口</h2><img src="logo-02-plugin-port.svg" alt="插件端口方案"></section>
      <section><h2>03 · 叠加羽化层</h2><img src="logo-03-layered-leaf.svg" alt="叠加羽化层方案"></section>
      <section><h2>04 · 轮廓过渡</h2><img src="logo-04-contour-fade.svg" alt="轮廓过渡方案"></section>
    </main>
  </body>
</html>
